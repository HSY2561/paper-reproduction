batch_size: 4
iters: 18000
loss:
  coef:
  - 1
  - 1
  - 1
  - 1
  - 1
  types:
  - &id001
    coef:
    - 0.8
    - 0.2
    losses:
    - min_kept: 65000
      type: OhemCrossEntropyLoss
    - type: DiceLoss
    type: MixedLoss
  - *id001
  - *id001
  - *id001
  - *id001
lr_scheduler:
  end_lr: 0.0
  learning_rate: 6.0e-05
  power: 1
  type: PolynomialDecay
model:
  num_classes: 2
  type: BiSeNetV2
  context_type: none
  shape_stream: false
optimizer:
  beta1: 0.9
  beta2: 0.999
  type: AdamW
  weight_decay: 0.01
train_dataset:
  dataset_root: C:/Users/user/algolab_data
  mode: train
  num_classes: 2
  train_path: C:/Users/user/algolab_data/train.txt
  transforms:
  - max_scale_factor: 2.0
    min_scale_factor: 0.5
    scale_step_size: 0.25
    type: ResizeStepScaling
  - crop_size:
    - 400
    - 400
    type: RandomPaddingCrop
  - type: RandomHorizontalFlip
  - brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
    type: RandomDistort
  - type: Normalize
  type: Dataset
val_dataset:
  dataset_root: C:/Users/user/algolab_data
  mode: val
  num_classes: 2
  transforms:
  - type: Normalize
  type: Dataset
  val_path: C:/Users/user/algolab_data/val.txt
