batch_size: 4
iters: 18000
model:
  type: SegFormerSimplify
  backbone:
    type: MixVisionTransformer_B0
    pretrained: experiments/segformer_crack500_aligned_wtconv_ablation_wave17_20261030/weights/mit_b0_imagenet_backbone.pdparams
  num_classes: 2
  embedding_dim: 256
  align_corners: false
  decoder_kind: concat
  alignment: full
  fusion_layout: standard
  pretrained: null
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 6.0e-05
  end_lr: 0.0
  power: 1
loss:
  types:
  - type: CrossEntropyLoss
  coef:
  - 1
train_dataset:
  type: Dataset
  dataset_root: data/Crack500
  train_path: data/Crack500/train.txt
  num_classes: 2
  mode: train
  transforms:
  - type: ResizeStepScaling
    min_scale_factor: 0.75
    max_scale_factor: 1.25
    scale_step_size: 0.25
  - type: RandomPaddingCrop
    crop_size:
    - 400
    - 400
  - type: RandomHorizontalFlip
  - type: RandomDistort
    brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
  - type: Normalize
val_dataset:
  type: Dataset
  dataset_root: data/Crack500
  val_path: data/Crack500/test.txt
  num_classes: 2
  mode: val
  transforms:
  - type: Normalize



