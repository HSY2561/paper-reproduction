batch_size: 4
iters: 18000

mean: &mean [0.485, 0.456, 0.406]
std: &std [0.229, 0.224, 0.225]
weight: &weight [1.0, 1.0]

model:
  type: PIDNet
  num_classes: 2
  head_channels: 128
  backbone:
    type: PIDNet_Small
  pretrained: https://paddleseg.bj.bcebos.com/dygraph/pidnet/pidnet_small_imagenet1k.pdparams

train_dataset:
  type: Dataset
  dataset_root: D:/Crack500_data_u8
  train_path: D:/Crack500_data_u8/train.txt
  num_classes: 2
  mode: train
  transforms:
    - type: AddEdgeLabel
    - type: ResizeStepScaling
      min_scale_factor: 0.5
      max_scale_factor: 2.1
      scale_step_size: 0.1
    - type: RandomPaddingCrop
      crop_size: [400, 400]
    - type: RandomHorizontalFlip
    - type: Normalize
      mean: *mean
      std: *std

val_dataset:
  type: Dataset
  dataset_root: D:/Crack500_data_u8
  val_path: D:/Crack500_data_u8/val.txt
  num_classes: 2
  mode: val
  transforms:
    - type: Normalize
      mean: *mean
      std: *std

optimizer:
  type: SGD
  momentum: 0.9
  weight_decay: 0.0005

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.01
  end_lr: 0.0
  power: 0.9

loss:
  types:
    - type: CrossEntropyLoss
      weight: *weight
      avg_non_ignore: False
    - type: OhemCrossEntropyLoss
      weight: *weight
      min_kept: 131072
      thresh: 0.9
    - type: BCELoss
      weight: dynamic
      edge_label: True
    - type: OhemCrossEntropyLoss
      weight: *weight
      min_kept: 131072
      thresh: 0.9
  coef: [0.4, 1.0, 10.0, 1.0]
