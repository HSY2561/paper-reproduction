batch_size: 4
iters: 18000
model:
  type: OCRNet
  backbone:
    type: HRNet_W18
  backbone_indices: [0]
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.00006
  end_lr: 0.0
  power: 1
loss:
  types:
  - type: CrossEntropyLoss
  - type: CrossEntropyLoss
  coef: [1, 0.4]
train_dataset:
  type: Dataset
  dataset_root: C:/Users/user/algolab_data
  train_path: C:/Users/user/algolab_data/train.txt
  num_classes: 2
  mode: train
  transforms:
  - type: ResizeStepScaling
    min_scale_factor: 0.75
    max_scale_factor: 1.25
    scale_step_size: 0.25
  - type: RandomPaddingCrop
    crop_size: [400, 400]
  - type: RandomHorizontalFlip
  - type: RandomDistort
    brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
  - type: Normalize
val_dataset:
  type: Dataset
  dataset_root: C:/Users/user/algolab_data
  val_path: C:/Users/user/algolab_data/val.txt
  num_classes: 2
  mode: val
  transforms:
  - type: Normalize



