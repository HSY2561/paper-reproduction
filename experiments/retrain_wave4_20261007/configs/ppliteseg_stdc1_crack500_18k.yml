batch_size: 4
iters: 18000
model:
  type: PPLiteSeg
  backbone:
    type: STDC1
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/PP_STDCNet1.tar.gz
  num_classes: 2
  arm_out_chs: [32, 64, 128]
  seg_head_inter_chs: [32, 64, 64]
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 6.0e-05
  power: 1
loss:
  types:
  - type: OhemCrossEntropyLoss
    min_kept: 65000
  - type: OhemCrossEntropyLoss
    min_kept: 65000
  - type: OhemCrossEntropyLoss
    min_kept: 65000
  coef: [1, 1, 1]
train_dataset:
  type: Dataset
  dataset_root: C:/Users/user/algolab_data
  train_path: C:/Users/user/algolab_data/train.txt
  num_classes: 2
  mode: train
  transforms:
  - type: ResizeStepScaling
    min_scale_factor: 0.5
    max_scale_factor: 2.0
    scale_step_size: 0.25
  - type: RandomPaddingCrop
    crop_size: [400, 400]
  - type: RandomHorizontalFlip
  - type: RandomDistort
    brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
  - type: Normalize
val_dataset:
  type: Dataset
  dataset_root: C:/Users/user/algolab_data
  val_path: C:/Users/user/algolab_data/val.txt
  num_classes: 2
  mode: val
  transforms:
  - type: Normalize


