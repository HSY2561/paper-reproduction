batch_size: 4
iters: 18000
model:
  type: SegFormerTen
  backbone:
    type: MixVisionTransformer_B0
    pretrained: null
  num_classes: 2
  embedding_dim: 256
  align_corners: false
  decoder_kind: concat
  alignment: full
  candidate: wtconv_wavelet
  fusion_layout: standard
  wavelet_levels: 1
  wavelet_kernel: 3
  pretrained: null
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 6.0e-05
  end_lr: 0.0
  power: 1
loss:
  types:
  - type: CrossEntropyLoss
    weight: [1.10, 1.0]
  coef:
  - 1
train_dataset:
  type: Dataset
  dataset_root: C:/Users/user/Desktop/segformer_aw_cross_dataset_wave17_20261106/normalized/DeepCrack
  train_path: C:/Users/user/Desktop/segformer_aw_cross_dataset_wave17_20261106/normalized/DeepCrack/train.txt
  num_classes: 2
  mode: train
  transforms:
  - type: ResizeStepScaling
    min_scale_factor: 0.75
    max_scale_factor: 1.25
    scale_step_size: 0.25
  - type: RandomPaddingCrop
    crop_size:
    - 400
    - 400
  - type: RandomHorizontalFlip
  - type: RandomDistort
    brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
  - type: Normalize
val_dataset:
  type: Dataset
  dataset_root: C:/Users/user/Desktop/segformer_aw_cross_dataset_wave17_20261106/normalized/DeepCrack
  val_path: C:/Users/user/Desktop/segformer_aw_cross_dataset_wave17_20261106/normalized/DeepCrack/test.txt
  num_classes: 2
  mode: val
  transforms:
  - type: Normalize






