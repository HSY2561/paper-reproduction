<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <title>SegFormer-B0 architecture for pavement crack segmentation</title>
  <desc>Publication-ready schematic of the MiT-B0 encoder, MLP decoder and pixel classifier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a202c" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font-family: "Times New Roman", Times, serif; font-size: 30px; font-weight: 700; fill: #1a202c; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #4a5568; }
      .section { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1px; fill: #2d3748; }
      .boxTitle { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1a202c; }
      .boxText { font-family: Arial, sans-serif; font-size: 15px; fill: #2d3748; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #4a5568; }
      .formula { font-family: "Times New Roman", Times, serif; font-size: 17px; font-style: italic; fill: #2d3748; }
      .encoder { fill: #e8f1fb; stroke: #2b6cb0; stroke-width: 2; }
      .decoder { fill: #edf8f1; stroke: #2f855a; stroke-width: 2; }
      .upsample { fill: #fff8e6; stroke: #b7791f; stroke-width: 2; }
      .head { fill: #f5edff; stroke: #805ad5; stroke-width: 2; }
      .input { fill: #f7fafc; stroke: #4a5568; stroke-width: 2; }
      .note { fill: #fffaf0; stroke: #b7791f; stroke-width: 1.5; }
      .line { stroke: #243447; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #2b6cb0; stroke-width: 2.2; fill: none; marker-end: url(#arrowBlue); }
      .lineGreen { stroke: #2f855a; stroke-width: 2.2; fill: none; marker-end: url(#arrowGreen); }
      .dash { stroke: #718096; stroke-width: 1.5; stroke-dasharray: 7 6; fill: none; }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">SegFormer-B0 for Pavement Crack Segmentation</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">MiT-B0 hierarchical encoder with lightweight MLP decoder and pixel-wise prediction head</text>

  <!-- section labels -->
  <text x="80" y="128" class="section">INPUT</text>
  <text x="250" y="128" class="section">MiT-B0 HIERARCHICAL ENCODER</text>
  <text x="242" y="615" class="section">MLP DECODER</text>
  <text x="1280" y="615" class="section">FUSION AND PREDICTION</text>

  <!-- input -->
  <rect x="45" y="185" width="165" height="205" rx="12" class="input" filter="url(#shadow)"/>
  <rect x="70" y="215" width="115" height="100" rx="4" fill="#dceaf7" stroke="#4a5568" stroke-width="1.5"/>
  <path d="M78 288 C100 245 118 284 136 251 C152 221 170 270 180 238" stroke="#9b2c2c" stroke-width="5" fill="none"/>
  <path d="M76 299 C103 274 119 309 138 278 C153 252 169 290 182 271" stroke="#c53030" stroke-width="2.5" fill="none"/>
  <text x="128" y="342" text-anchor="middle" class="boxTitle">Input image I</text>
  <text x="128" y="365" text-anchor="middle" class="boxText">3 × H × W</text>
  <text x="128" y="420" text-anchor="middle" class="small">Training crop: 400 × 400</text>

  <!-- encoder stages -->
  <rect x="250" y="170" width="170" height="250" rx="12" class="encoder" filter="url(#shadow)"/>
  <text x="335" y="203" text-anchor="middle" class="boxTitle">Stage 1</text>
  <text x="335" y="228" text-anchor="middle" class="boxText">Overlap patch embed</text>
  <rect x="278" y="250" width="114" height="62" rx="8" fill="#c7ddf4" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="335" y="276" text-anchor="middle" class="boxText">Transformer</text>
  <text x="335" y="297" text-anchor="middle" class="boxText">blocks × 2</text>
  <text x="335" y="348" text-anchor="middle" class="formula">H/4 × W/4</text>
  <text x="335" y="373" text-anchor="middle" class="boxText">C₁ = 32</text>

  <rect x="455" y="170" width="170" height="250" rx="12" class="encoder" filter="url(#shadow)"/>
  <text x="540" y="203" text-anchor="middle" class="boxTitle">Stage 2</text>
  <text x="540" y="228" text-anchor="middle" class="boxText">Overlap patch embed</text>
  <rect x="483" y="250" width="114" height="62" rx="8" fill="#c7ddf4" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="540" y="276" text-anchor="middle" class="boxText">Transformer</text>
  <text x="540" y="297" text-anchor="middle" class="boxText">blocks × 2</text>
  <text x="540" y="348" text-anchor="middle" class="formula">H/8 × W/8</text>
  <text x="540" y="373" text-anchor="middle" class="boxText">C₂ = 64</text>

  <rect x="660" y="170" width="170" height="250" rx="12" class="encoder" filter="url(#shadow)"/>
  <text x="745" y="203" text-anchor="middle" class="boxTitle">Stage 3</text>
  <text x="745" y="228" text-anchor="middle" class="boxText">Overlap patch embed</text>
  <rect x="688" y="250" width="114" height="62" rx="8" fill="#c7ddf4" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="745" y="276" text-anchor="middle" class="boxText">Transformer</text>
  <text x="745" y="297" text-anchor="middle" class="boxText">blocks × 2</text>
  <text x="745" y="348" text-anchor="middle" class="formula">H/16 × W/16</text>
  <text x="745" y="373" text-anchor="middle" class="boxText">C₃ = 160</text>

  <rect x="865" y="170" width="170" height="250" rx="12" class="encoder" filter="url(#shadow)"/>
  <text x="950" y="203" text-anchor="middle" class="boxTitle">Stage 4</text>
  <text x="950" y="228" text-anchor="middle" class="boxText">Overlap patch embed</text>
  <rect x="893" y="250" width="114" height="62" rx="8" fill="#c7ddf4" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="950" y="276" text-anchor="middle" class="boxText">Transformer</text>
  <text x="950" y="297" text-anchor="middle" class="boxText">blocks × 2</text>
  <text x="950" y="348" text-anchor="middle" class="formula">H/32 × W/32</text>
  <text x="950" y="373" text-anchor="middle" class="boxText">C₄ = 256</text>

  <!-- encoder flow -->
  <path d="M210 288 L250 288" class="line"/>
  <path d="M420 288 L455 288" class="lineBlue"/>
  <path d="M625 288 L660 288" class="lineBlue"/>
  <path d="M830 288 L865 288" class="lineBlue"/>
  <text x="438" y="268" text-anchor="middle" class="small">×2 downsample</text>
  <text x="643" y="268" text-anchor="middle" class="small">×2 downsample</text>
  <text x="848" y="268" text-anchor="middle" class="small">×2 downsample</text>

  <!-- outputs to MLP -->
  <path d="M335 420 L335 700" class="lineBlue"/>
  <path d="M540 420 L540 700" class="lineBlue"/>
  <path d="M745 420 L745 700" class="lineBlue"/>
  <path d="M950 420 L950 700" class="lineBlue"/>
  <text x="348" y="470" class="small">F₁</text>
  <text x="553" y="470" class="small">F₂</text>
  <text x="758" y="470" class="small">F₃</text>
  <text x="963" y="470" class="small">F₄</text>

  <!-- MLP decoder blocks -->
  <rect x="270" y="700" width="130" height="120" rx="10" class="decoder" filter="url(#shadow)"/>
  <text x="335" y="733" text-anchor="middle" class="boxTitle">MLP₁</text>
  <text x="335" y="758" text-anchor="middle" class="boxText">Flatten + Linear</text>
  <text x="335" y="783" text-anchor="middle" class="formula">C₁ → C=256</text>

  <rect x="475" y="700" width="130" height="120" rx="10" class="decoder" filter="url(#shadow)"/>
  <text x="540" y="733" text-anchor="middle" class="boxTitle">MLP₂</text>
  <text x="540" y="758" text-anchor="middle" class="boxText">Flatten + Linear</text>
  <text x="540" y="783" text-anchor="middle" class="formula">C₂ → C=256</text>

  <rect x="680" y="700" width="130" height="120" rx="10" class="decoder" filter="url(#shadow)"/>
  <text x="745" y="733" text-anchor="middle" class="boxTitle">MLP₃</text>
  <text x="745" y="758" text-anchor="middle" class="boxText">Flatten + Linear</text>
  <text x="745" y="783" text-anchor="middle" class="formula">C₃ → C=256</text>

  <rect x="885" y="700" width="130" height="120" rx="10" class="decoder" filter="url(#shadow)"/>
  <text x="950" y="733" text-anchor="middle" class="boxTitle">MLP₄</text>
  <text x="950" y="758" text-anchor="middle" class="boxText">Flatten + Linear</text>
  <text x="950" y="783" text-anchor="middle" class="formula">C₄ → C=256</text>

  <!-- upsample -->
  <path d="M400 760 L1060 760" class="dash"/>
  <path d="M605 760 L1060 760" class="dash"/>
  <path d="M810 760 L1060 760" class="dash"/>
  <path d="M1015 760 L1060 760" class="lineGreen"/>
  <rect x="1045" y="700" width="140" height="120" rx="10" class="upsample" filter="url(#shadow)"/>
  <text x="1115" y="730" text-anchor="middle" class="boxTitle">Upsample</text>
  <text x="1115" y="756" text-anchor="middle" class="boxText">Bilinear to</text>
  <text x="1115" y="781" text-anchor="middle" class="formula">H/4 × W/4</text>
  <text x="1115" y="806" text-anchor="middle" class="small">for each scale</text>

  <!-- concat fusion -->
  <path d="M1185 760 L1240 760" class="lineGreen"/>
  <rect x="1240" y="700" width="150" height="120" rx="10" class="decoder" filter="url(#shadow)"/>
  <text x="1315" y="733" text-anchor="middle" class="boxTitle">Concatenate</text>
  <text x="1315" y="758" text-anchor="middle" class="boxText">[F̂₁; F̂₂; F̂₃; F̂₄]</text>
  <text x="1315" y="784" text-anchor="middle" class="formula">4C → 256</text>
  <text x="1315" y="807" text-anchor="middle" class="small">aligned at 1/4 scale</text>

  <path d="M1390 760 L1430 760" class="lineGreen"/>
  <rect x="1430" y="700" width="145" height="120" rx="10" class="head" filter="url(#shadow)"/>
  <text x="1502" y="730" text-anchor="middle" class="boxTitle">Fusion</text>
  <text x="1502" y="755" text-anchor="middle" class="boxText">1×1 Conv + BN/ReLU</text>
  <text x="1502" y="780" text-anchor="middle" class="boxText">Dropout p=0.1</text>
  <text x="1502" y="805" text-anchor="middle" class="small">256 channels</text>

  <path d="M1575 760 L1615 760" class="line"/>
  <rect x="1615" y="700" width="140" height="120" rx="10" class="head" filter="url(#shadow)"/>
  <text x="1685" y="730" text-anchor="middle" class="boxTitle">Classifier</text>
  <text x="1685" y="756" text-anchor="middle" class="boxText">1×1 Conv</text>
  <text x="1685" y="781" text-anchor="middle" class="formula">256 → 2</text>
  <text x="1685" y="806" text-anchor="middle" class="small">crack / background</text>

  <!-- final output -->
  <path d="M1755 760 L1780 760" class="line"/>
  <text x="1778" y="730" text-anchor="end" class="boxTitle">Output</text>
  <text x="1778" y="802" text-anchor="end" class="formula">H × W × 2</text>

  <!-- bottom annotations -->
  <rect x="75" y="905" width="1650" height="95" rx="12" class="note"/>
  <text x="100" y="938" class="boxTitle">Resolution example for the 400 × 400 training crop:</text>
  <text x="100" y="970" class="boxText">Stage outputs: 100 × 100, 50 × 50, 25 × 25, and approximately 13 × 13 → all projected to 100 × 100 → fused → bilinear upsampled to 400 × 400.</text>

  <!-- legend -->
  <rect x="1280" y="110" width="470" height="55" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <rect x="1300" y="128" width="20" height="20" class="encoder"/>
  <text x="1328" y="144" class="small">MiT-B0 encoder</text>
  <rect x="1430" y="128" width="20" height="20" class="decoder"/>
  <text x="1458" y="144" class="small">MLP decoder</text>
  <rect x="1570" y="128" width="20" height="20" class="head"/>
  <text x="1598" y="144" class="small">Prediction head</text>

  <!-- panel labels -->
  <text x="55" y="1045" class="section">(a)</text>
  <text x="82" y="1045" class="small">Input and hierarchical feature extraction</text>
  <text x="635" y="1045" class="section">(b)</text>
  <text x="662" y="1045" class="small">Lightweight MLP decoder and multi-scale alignment</text>
  <text x="1355" y="1045" class="section">(c)</text>
  <text x="1382" y="1045" class="small">Fusion, classification and full-resolution prediction</text>
</svg>
