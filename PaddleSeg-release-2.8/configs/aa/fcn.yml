# 训练迭代次数和批大小
batch_size: 8
iters: 18000

# --- 数据集配置 (已适配您的裂缝数据集) ---
train_dataset:
  type: Dataset
  dataset_root: data/
  train_path: data/train.txt
  num_classes: 2
  mode: train
  transforms:
    - type: ResizeStepScaling
      min_scale_factor: 0.5
      max_scale_factor: 2.0
      scale_step_size: 0.25
    - type: RandomPaddingCrop
      crop_size: [720, 720] # 统一裁剪尺寸
    - type: RandomHorizontalFlip
    - type: RandomDistort
      brightness_range: 0.4
      contrast_range: 0.4
      saturation_range: 0.4
    - type: Normalize

val_dataset:
  type: Dataset
  dataset_root: data/
  val_path: data/val.txt
  num_classes: 2
  mode: val
  transforms:
    - type: Normalize

# --- 模型配置 (保留 FCN + HRNet_W18 结构) ---
model:
  type: FCN
  backbone:
    type: HRNet_W18
    align_corners: False
    # 预训练模型会自动下载
    pretrained: D:\Project\Python\PaddleSeg-release-2.8\pretrained\hrnet_w18.pdparams
  num_classes: 2
  backbone_indices: [-1]

# --- 优化器 ---
optimizer:
  type: SGD
  momentum: 0.9
  weight_decay: 0.0005

# --- 学习率策略 (与 hrsegnet 对齐) ---
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.01 # 调整学习率
  end_lr: 0
  power: 0.9
  warmup_iters: 1000 # 增加预热
  warmup_start_lr: 1.0e-5

# --- 损失函数 (与 hrsegnet 对齐) ---
loss:
  types:
    - type: OhemCrossEntropyLoss # 使用在线难例挖掘损失
  coef: [1]
