batch_size: 4
iters: 6000
model:
  type: BiSeNetV2
  num_classes: 2
  context_type: ppm
  attention_type: se
optimizer:
  type: AdamW
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
lr_scheduler:
  type: PolynomialDecay
  learning_rate: 6.0e-05
  power: 1
loss:
  types:
  - &id001
    type: MixedLoss
    losses:
    - type: OhemCrossEntropyLoss
      min_kept: 65000
    - type: DiceLoss
    coef:
    - 0.8
    - 0.2
  - *id001
  - *id001
  - *id001
  - *id001
  coef:
  - 1
  - 1
  - 1
  - 1
  - 1
train_dataset:
  type: Dataset
  dataset_root: /hy-tmp/crack_project/data/Crack500_data_u8
  train_path: /hy-tmp/crack_project/data/Crack500_data_u8/train.txt
  num_classes: 2
  mode: train
  transforms:
  - type: ResizeStepScaling
    min_scale_factor: 0.5
    max_scale_factor: 2.0
    scale_step_size: 0.25
  - type: RandomPaddingCrop
    crop_size:
    - 400
    - 400
  - type: RandomHorizontalFlip
  - type: RandomDistort
    brightness_range: 0.5
    contrast_range: 0.5
    saturation_range: 0.5
  - type: Normalize
val_dataset:
  type: Dataset
  dataset_root: /hy-tmp/crack_project/data/Crack500_data_u8
  val_path: /hy-tmp/crack_project/data/Crack500_data_u8/val.txt
  num_classes: 2
  mode: val
  transforms:
  - type: Normalize
